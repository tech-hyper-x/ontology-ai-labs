# 실습 화면의 예시 질문 9개 (Part 2 Ch1-1 변경 영향 질문 정의, 설계 덱 34장)
# Q8 · Q9 는 하이브리드 검색(CQ-15)을 보여 주는 문서 검색 질문이다 (Golden Set G40 · G44 와 같은 질문).
# work: 화면의 업무 선택 (구매 수량·원가 · 부품 변경·단종 · 고장 점검·교체). 고른 업무의 카드만 보여 준다.
# label: 카드 이름. question: 카드에 끝까지 보여 주고, 누르면 입력창에 들어가는 전체 질문.
#   질문은 업계 용어 대신 풀어 쓴다 (2-pack → 2개씩 묶어 판매하는, 어셈블리 → 조립 단위).
# shows: 이 질문으로 확인할 내용. assumption: 단종 · 공급 중단 · 단가 인상 같은 교육용 가정이 있으면 true.
# role: 이 질문을 주로 묻는 현업 역할 (기록용).
# ─── [Hands-on P2-Ch1-1 변경 영향 질문 정의] 시작 ───
# 질문마다 답에 필요한 수량 · 가격 · 개정 시점을 적어 본다. 이 9개가 스킬 · 도구 · Golden Set 의 출발점이다.
examples:
  - id: Q1
    work: 구매 수량·원가
    label: 구매 수량 계산
    role: 생산계획 · 구매
    type: 수량
    question: 로봇 차량 20대 생산에 필요한 부품 중, 2개씩 묶어 판매하는 부품은 종류별로 몇 팩을 구매해야 하나요?
    shows: 부품별 필요 수량 · 구매 팩 수 · 구매 금액
  - id: Q2
    work: 구매 수량·원가
    label: 차량 원가 확인
    role: 생산계획 · 구매
    type: 원가
    question: 로봇 차량 1대를 만드는 데 드는 기계 부품 원가는 얼마이고, 조립 단위(어셈블리)별로는 얼마인가요?
    shows: 전체 원가 · 조립 단위별 원가
  - id: Q6
    work: 구매 수량·원가
    label: 단가 인상 영향
    role: 생산계획 · 구매
    type: 단가 변경
    question: 모터 가격이 15% 오르면, 로봇 차량 100대를 만들 때 모터 부품비는 얼마나 늘어나나요?
    shows: 변경 전후 모터 부품비 · 증가 금액
    assumption: true
  - id: Q3
    work: 부품 변경·단종
    label: 변경 전후 비교
    role: 설계변경 엔지니어
    type: Revision 영향
    question: 2024년 6월 휠 교체(교육용 변경 기록) 전후로 바뀐 부품은 무엇이고, 로봇 차량 1대 원가는 얼마나 달라졌나요?
    shows: 바뀐 부품 · 1대 원가 차이 · 적용 기간
  - id: Q4
    work: 부품 변경·단종
    label: 단종 부품 영향
    role: 설계변경 엔지니어
    type: Where-used
    # 원천 문서(parts_list/extra_parts.md "Different wheels")에 대체 부품과 장착 조건이 적힌 부품을 고른다.
    # 서보(2000-0025-0002)는 NASA 원천 자료에 대체 부품이 없어 "대신 쓸 부품" 질문에 답할 근거가 없다.
    question: 휠(3616-0014-0144)이 단종된다면, 로봇 차량 50대 생산에 몇 개가 필요하고 비용은 얼마이며 대신 쓸 부품이 있나요?
    shows: 필요 수량 · 부품비 · 대체 부품과 장착 조건
    assumption: true
  - id: Q5
    work: 부품 변경·단종
    label: 공급 중단 영향
    role: 설계변경 엔지니어
    type: 공급 리스크
    question: goBILDA에서 부품을 더 이상 공급받지 못하면, 어떤 부품과 조립 단위를 다시 검토해야 하나요?
    shows: 다른 공급처가 없는 부품 수 · 영향받는 조립 단위
    assumption: true
  - id: Q7
    work: 고장 점검·교체
    label: 코너 휠 고장 점검
    role: 정비 · 품질
    type: Hybrid
    question: 코너 바퀴가 돌지 않을 때 어떤 부품을 점검해야 하고, 교체하려면 부품비가 얼마나 드나요?
    shows: 점검할 부품 · 근거 정비 문서 · 교체 부품비
  - id: Q8
    work: 고장 점검·교체
    label: 정비 문서 찾기
    role: 정비 · 품질
    type: Hybrid Search
    # 증상 표현이라 키워드(BM25)와 벡터 순위가 문서마다 다르다. RRF 결합 순위로 서보 기어 교체 문서를 1위에 찾는다
    question: 코너 바퀴가 돌지 않을 때 참고할 정비 문서는 무엇인가요?
    shows: 근거 정비 문서 · 키워드 · 벡터 · 결합 검색 순위
  - id: Q9
    work: 고장 점검·교체
    label: 품번으로 이슈 찾기
    role: 정비 · 품질
    type: Hybrid Search
    # 품번은 키워드(BM25)가 정확히 찾는다. 벡터 검색도 같은 이슈를 1위로 찾는다
    question: goBILDA 스페이서(1514-0010-0060) 단종을 다룬 이슈는 무엇인가요?
    shows: 관련 이슈 · 키워드 · 벡터 · 결합 검색 순위
# ─── [Hands-on P2-Ch1-1] 끝 ───
