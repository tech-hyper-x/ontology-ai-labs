# 실습 화면 테마 — 강의 덱의 색(Primary #2d5bff, 회색 배경 #f7f8fa)에 맞춘다
[theme]
base = "light"
primaryColor = "#2d5bff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fa"
textColor = "#111827"

[client]
# 개발용 Deploy 버튼 · 메뉴를 숨긴다 (실습 화면을 업무 화면처럼 보이게)
toolbarMode = "minimal"

[server]
headless = true
