[project]
name = "mfg-bom-agent"
version = "0.1.0"
description = "온톨로지 강의 제조 실습 — NASA Open Source Rover BOM 변경 영향 분석 에이전트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "langchain-anthropic",
    "langchain-core",
    "langgraph",
    "neo4j",
    "neo4j-graphrag",
    "fastmcp",
    "httpx",
    "streamlit",
    "pydantic>=2",
    "pydantic-settings",
    "langfuse",
    "python-dotenv",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfg_bom_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
