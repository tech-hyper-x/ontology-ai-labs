    text: EGFR 체세포 변이는 비소세포폐암의 원인 유전자 근거로 기록되어 있다.
    label: correct
    evidence: [37b86673a413c94274aaf887dd0d9bdc5ef92d4b]
  - claim_id: CLM-002
    target: MET
    text: capmatinib 은 MET 엑손 14 결손 비소세포폐암에서 임상 근거가 있다.
    label: correct
    evidence: [969fddf8c40153638616c05333c53d83d97b6c6e]
  - claim_id: CLM-003
    target: KRAS
    text: KRAS 를 표적으로 하는 3세대 억제제 osimertinib 의 임상 근거가 있다.
    label: wrong_target
    evidence: [6b359d8538db62b5c253765c417d5b326f04fc5d]
  - claim_id: CLM-004
    target: EGFR
    text: EGFR 억제제 내성은 사내 실험으로 확인되었다.
    label: missing_id
    evidence: [ev_does_not_exist_0001]
  - claim_id: CLM-005
    target: KRAS
    text: sotorasib 은 KRAS 표적 승인 약물로 임상 선례가 있다.
