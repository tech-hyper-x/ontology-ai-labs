# 인용 검토(CQ-14 · 시나리오 7)용 주장 예시. graph/load.py 가 (:Claim)-[:CITES]->(:Evidence) 로 적재한다.
# label: 정답 판정 (사람이 미리 정한 값) — correct · wrong_target · missing_id · path_ok_meaning_mismatch
#   path_ok_meaning_mismatch 는 경로는 맞지만 근거가 문장을 뒷받침하지 않는 경우다.
#   자동 검사(경로 확인)로는 통과하므로, 의미 판정은 사람 판정 · 별도 평가가 필요하다는 것을 보여 준다.
# evidence: 실제 근거 ID (Open Targets 26.09 evidence id). missing_id 는 일부러 없는 ID 를 넣었다.
claims:
