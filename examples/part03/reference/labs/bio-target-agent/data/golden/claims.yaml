    evidence: [86937af87a522c41973f4d4e46e84ec424098c9f, 398fce35be364d8fef7d2cd9a1c2f28e92bbd9b8]
  - claim_id: CLM-006
    target: MET
    text: MET 표적 억제제는 안전성 이슈가 보고되지 않았다.
    label: path_ok_meaning_mismatch
    evidence: [523ed75134e674554acea8f63d0c1032a12f0a1f]
