# 신약 R&D 표적 우선순위 온톨로지 (설계 덱 21~25장 · 3~4단계)
#
# 이 파일이 "의미의 원본"이다. Neo4j 는 이 정의대로 데이터를 담는 저장소이고,
# 제약 조건 · 검증 쿼리 · 에이전트에게 주는 스키마 설명은 모두 이 파일에서 만든다 (설계 덱 31장).
# 클래스 · 관계마다 근거 CQ(cq)를 적는다. 어떤 CQ 에도 쓰이지 않는 요소는 만들지 않는다.
#
# 형식: classes(개념) · relations(관계) · evidence_types(근거 유형) · rules(추론 규칙) · competency_questions(CQ)

version: "1.0"
release: "26.09"           # Open Targets 데이터 릴리스
retrieved_at: "2026-10-26" # 스냅샷 조회일
reuse:
  # 재사용 검토 결과 (설계 덱 20장). 그대로 사용 = ID 체계를 그대로, 정의 차용 = 의미만 따른다, 정렬 = 대응표만
  - {standard: MONDO · EFO, level: 그대로 사용, mapping: "Disease.mondo_id · xrefs(EFO · MeSH)"}
  - {standard: HGNC · Ensembl, level: 그대로 사용, mapping: "Gene.ensembl_id · symbol · aliases"}
  - {standard: UniProt, level: 그대로 사용, mapping: "Protein.uniprot_id"}
  - {standard: ChEMBL · PubChem, level: 그대로 사용, mapping: "Compound.chembl_id(부모) · cid · inchikey"}
  - {standard: ECO, level: 정의 차용, mapping: "EvidenceType 9종 정의"}
  - {standard: Biolink Model, level: 정의 차용, mapping: "Association 을 개체로 두고 근거를 붙인다"}
  - {standard: HGVS · Sequence Ontology, level: 정의 차용, mapping: "MolecularContext 표기"}
  - {standard: PROV-O, level: 정렬, mapping: "Source · retrieved_at · origin"}

classes:
  Disease:
    definition: 질환 (Open Targets 질환 ID — NSCLC 는 MONDO)
    id: mondo_id
    required: [mondo_id, name]
    cq: [CQ-01]
  Gene:
    definition: 유전자 (Ensembl gene ID · HGNC 심볼)
    id: ensembl_id
    required: [ensembl_id, symbol]
    notes: aliases 는 HGNC · Open Targets 동의어 + 사내 표기. 개체 연결 · resolve_entity 가 쓴다
    cq: [CQ-06]
  Protein:
    definition: 유전자가 만드는 단백질 (UniProt)
    id: uniprot_id
    required: [uniprot_id]
    cq: [CQ-06]
  Target:
    definition: 약물이 작용하는 표적 — 유전자 · 단백질의 '역할'. 이번 반복은 유전자당 표적 1개
    id: target_id
    required: [target_id, symbol]
    notes: target_id = "TGT:" + Ensembl ID. Gene 과 키가 겹치지 않게 접두어를 붙인다 (설계 검수 판단 2)
    cq: [CQ-01, CQ-08, CQ-09, CQ-13]
  Association:
    definition: 표적–질환 연관 주장. 점수 · 근거 유형별 점수 · 릴리스의 단위
    id: assoc_id
    required: [assoc_id, score, release]
    notes: >-
      Open Targets 점수는 근거 집계 순위 지표이며 성공 확률이 아니다. evidence_total · evidence_counts 는
      원천 전체 건수이고, Evidence 노드는 그중 적재한 레코드만이다 (문헌은 점수 상위 300건).
    cq: [CQ-01, CQ-02, CQ-03]
  Evidence:
    definition: 근거 개체 — 연관을 뒷받침하는 원천 레코드 하나 (Open Targets 근거 또는 사내 실험)
    id: evidence_id
    required: [evidence_id, datasource, score, retrieved_at]
    cq: [CQ-03, CQ-04, CQ-13, CQ-14]
  EvidenceType:
    definition: 근거 유형 9종 (Open Targets datatype 8 + 사내 실험)
    id: code
    required: [code, name]
    cq: [CQ-02, CQ-03]
  Source:
    definition: 데이터 출처 · 릴리스 (예 europepmc@26.09, internal_assay@2026-09-30)
    id: source_id
    required: [source_id, name, release]
    cq: [CQ-03]
  Paper:
    definition: 논문 (PMID). 초록이 있는 논문만 검색 색인에 들어간다
    id: pmid
    required: [pmid]
    cq: [CQ-04, CQ-07]
  MolecularContext:
    definition: 변이 · 융합 등 약물 반응 해석에 필요한 분자 맥락 (예 KRAS p.G12C, EML4::ALK)
    id: context_id
    required: [context_id, label, kind]
    cq: [CQ-05]
  Compound:
    definition: 화합물 — ChEMBL 부모 화합물 기준. 염 형태는 별칭 ID 로 둔다
    id: chembl_id
    required: [chembl_id]
    cq: [CQ-10, CQ-11]
  Drug:
    definition: 승인 · 임상 약물 (Compound 의 하위 라벨 — :Compound:Drug)
    id: chembl_id
    required: [chembl_id, name, max_stage]
    cq: [CQ-10]
  ClinicalTrial:
    definition: 임상시험 (ClinicalTrials.gov NCT ID 등 Open Targets clinicalReports ID)
    id: trial_id
    required: [trial_id]
    cq: [CQ-10]
  SafetyLiability:
    definition: 표적의 알려진 안전성 이슈 (Open Targets safetyLiabilities)
    id: liability_id
    required: [liability_id, event]
    notes: 이슈가 0건이면 노드가 없다. '위험 없음'이 아니라 '기록 없음'으로 답한다
    cq: [CQ-09, CQ-13]
  InternalProject:
    definition: 사내 과제 (교육용 가상 데이터)
    id: project_id
    required: [project_id, modality, stage, status]
    cq: [CQ-12, CQ-13]
  Claim:
    definition: 리포트의 주요 사실 주장 (CLM-…). 사람이 판정한 평가용 주장도 같은 클래스
    id: claim_id
    required: [claim_id, text]
    cq: [CQ-14]

relations:
  ENCODES:        {domain: [Gene], range: [Protein], cardinality: "1:N", cq: [CQ-06]}
  ACTS_AS:        {domain: [Protein], range: [Target], cardinality: "N:1", cq: [CQ-06]}
  HAS_ASSOCIATION: {domain: [Target], range: [Association], cardinality: "1:N · 질환 · 릴리스별 1개", cq: [CQ-01]}
  FOR_DISEASE:    {domain: [Association], range: [Disease], cardinality: "N:1 · 필수", cq: [CQ-01]}
  SUPPORTED_BY:   {domain: [Association], range: [Evidence], cardinality: "1:N", cq: [CQ-03]}
  HAS_TYPE:       {domain: [Evidence], range: [EvidenceType], cardinality: "N:1 · 필수", cq: [CQ-02, CQ-03]}
  FROM_SOURCE:    {domain: [Evidence], range: [Source, Paper], cardinality: "Source N:1 · Paper N:M", cq: [CQ-03, CQ-04]}
  HAS_CONTEXT:    {domain: [Association, Evidence], range: [MolecularContext], cardinality: "N:M · 선택", cq: [CQ-05]}
  MODULATES:      {domain: [Compound], range: [Target], required: [activity_type, source], cq: [CQ-10, CQ-11]}
  TESTED_IN:      {domain: [Drug], range: [ClinicalTrial], required: [stage], cq: [CQ-10]}
  HAS_LIABILITY:  {domain: [Target], range: [SafetyLiability], cq: [CQ-09]}
  TARGETS:        {domain: [InternalProject], range: [Target], required: [as_of], cq: [CQ-12]}
  MENTIONS:       {domain: [Paper], range: [Gene, Disease, Compound, MolecularContext], required: [method, confidence], cq: [CQ-07]}
  CITES:          {domain: [Claim], range: [Evidence], cq: [CQ-14]}

evidence_types:
  # Open Targets datatype → EvidenceType 코드 (설계 덱 21장 · 42장)
  genetic_association: {code: GeneticAssociation, name: 유전 연관}
  genetic_literature:  {code: GeneticLiterature, name: 유전 문헌}
  somatic_mutation:    {code: SomaticMutation, name: 체세포 변이}
  clinical:            {code: Clinical, name: 임상 (약물 선례)}
  affected_pathway:    {code: AffectedPathway, name: 영향 경로}
  literature:          {code: Literature, name: 문헌}
  rna_expression:      {code: Expression, name: 발현}
  animal_model:        {code: AnimalModel, name: 동물 모델}
  internal_assay:      {code: InternalAssay, name: 사내 실험}

rules:
  # 추론 규칙 4개 (설계 덱 24장). 결과에는 "추론됨" 표시와 근거 경로를 함께 남긴다
  - id: GeneticallySupported
    definition: 유전 연관 · 체세포 변이 · 유전 문헌 유형 점수 중 최댓값 ≥ 0.5 (정책 v1 기준값)
    result: 태그 + 근거 경로
  - id: Tractable
    definition: 저분자 · 항체 Tractability 양성, 또는 IC50 ≤ 1,000 nM 화합물 존재
    result: 태그 + 근거 항목
  - id: SafetyWarning
    definition: SafetyLiability 1건 이상. 0건은 경고 대신 근거 공백
    result: 리포트 경고 섹션
  - id: InternalOverlap
    definition: 사내 과제가 이미 그 표적을 TARGETS
    result: 중복 과제 · 확장 기회 표시

competency_questions:
  # 설계 덱 18~21장. type = 사실 조회 · 관계 탐색 · 규칙 추론 · 비정형 근거 · 수치 집계
  - {id: CQ-01, question: "질환 D의 연관 표적 상위 k는?", type: 관계 탐색, query: cq_01_top_targets.cypher}
  - {id: CQ-02, question: "표적 T–질환 D 연관의 근거 유형별 점수는?", type: 사실 조회, query: cq_02_type_scores.cypher}
  - {id: CQ-03, question: "연관 A를 뒷받침하는 근거와 출처는?", type: 관계 탐색, query: cq_03_evidence.cypher}
  - {id: CQ-04, question: "근거 E의 원문 논문(PMID)과 초록은?", type: 사실 조회, query: cq_04_evidence_paper.cypher}
  - {id: CQ-05, question: "표적 T의 근거 중 변이 · 융합 맥락이 있는 것은?", type: 관계 탐색, query: cq_05_context.cypher}
  - {id: CQ-06, question: "별칭 N이 가리키는 표적은?", type: 사실 조회, query: cq_06_resolve.cypher}
  - {id: CQ-07, question: "질문 Q와 관련된 문헌 근거는?", type: 비정형 근거, query: cq_07_hybrid_papers.cypher}
  - {id: CQ-08, question: "표적 T의 약물화 가능성 근거는?", type: 사실 조회, query: cq_08_tractability.cypher}
  - {id: CQ-09, question: "표적 T의 안전성 이슈는?", type: 사실 조회, query: cq_09_safety.cypher}
  - {id: CQ-10, question: "표적 T에 작용하는 약물과 최고 임상 단계는?", type: 관계 탐색, query: cq_10_drugs.cypher}
  - {id: CQ-11, question: "표적 T의 활성 화합물과 IC50은?", type: 관계 탐색, query: cq_11_compounds.cypher}
  - {id: CQ-12, question: "사내 과제가 이미 표적 T를 다루는가?", type: 사실 조회, query: cq_12_internal.cypher}
  - {id: CQ-13, question: "표적 T의 규칙 태그는?", type: 규칙 추론, query: cq_13_rule_tags.cypher}
  - {id: CQ-14, question: "주장 C가 인용한 근거 E가 존재하고 경로가 이어지는가?", type: 규칙 추론, query: cq_14_citation.cypher}
  - {id: CQ-15, question: "사내 기준 점수 계산에 필요한 재료는?", type: 수치 집계, query: cq_15_score_inputs.cypher}
